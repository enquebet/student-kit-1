<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Subtle gradient background -->
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <circle cx="1100" cy="100" r="300" fill="#4285F4" fill-opacity="0.08"/>
  <circle cx="100" cy="530" r="280" fill="#34A853" fill-opacity="0.08"/>
  <circle cx="950" cy="500" r="250" fill="#EA4335" fill-opacity="0.06"/>
  <circle cx="200" cy="80" r="220" fill="#FBBC05" fill-opacity="0.08"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Google Quad-color top bar -->
  <rect x="24" y="24" width="288" height="8" fill="#4285F4"/>
  <rect x="312" y="24" width="288" height="8" fill="#EA4335"/>
  <rect x="600" y="24" width="288" height="8" fill="#FBBC05"/>
  <rect x="888" y="24" width="288" height="8" fill="#34A853"/>

  <!-- Brand badge -->
  <rect x="100" y="100" width="260" height="44" rx="22" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="124" cy="122" r="6" fill="#2563EB"/>
  <text x="142" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E40AF" letter-spacing="1">100% FREE &amp; CLIENT-SIDE</text>

  <!-- Title -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#0F172A">
    StudentKit
  </text>

  <!-- Subtitle -->
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">
    Academic, Engineering &amp; Developer Utilities
  </text>

  <!-- Tagline -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#64748B">
    158 high-precision calculators, code formatters, and academic tools.
  </text>
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#64748B">
    Zero trackers. Zero signups. Blazingly fast in-browser computing.
  </text>

  <!-- Stats boxes -->
  <!-- Box 1 -->
  <rect x="100" y="440" width="220" height="110" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="130" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#2563EB">158</text>
  <text x="130" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">FREE UTILITIES</text>

  <!-- Box 2 -->
  <rect x="340" y="440" width="220" height="110" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="370" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#059669">12</text>
  <text x="370" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">DISCIPLINES</text>

  <!-- Box 3 -->
  <rect x="580" y="440" width="220" height="110" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="610" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#D97706">0 ms</text>
  <text x="610" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">SERVER DELAY</text>

  <!-- Box 4 -->
  <rect x="820" y="440" width="280" height="110" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="850" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#7C3AED">100%</text>
  <text x="850" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">PRIVATE &amp; CLIENT-SIDE</text>
</svg>
