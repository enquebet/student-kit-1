<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Page Title & Meta Description -->
    <title>StudentKit – Free Academic, Engineering & Developer Utilities</title>
    <meta name="description" content="158 free, privacy-first, client-side tools for students, engineers, and developers. Fast GPA/CGPA calculators, Ohm's law, JSON formatters, and unit converters with zero tracking." />
    <meta name="keywords" content="student tools, gpa calculator, cgpa calculator, attendance tracker, ohms law calculator, resistor color code, json formatter, base64 encoder, jwt inspector, unit converter, developer utilities, engineering tools, free online calculators" />
    <meta name="author" content="StudentKit Contributors" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="application-name" content="StudentKit" />
    <meta name="apple-mobile-web-app-title" content="StudentKit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://studentkit.dev/" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudentKit" />
    <meta property="og:url" content="https://studentkit.dev/" />
    <meta property="og:title" content="StudentKit – Free Academic, Engineering & Developer Utilities" />
    <meta property="og:description" content="158 free, privacy-first, client-side tools for students, engineers, and developers. Zero trackers, no signup, and instant in-browser computation." />
    <meta property="og:image" content="https://studentkit.dev/assets/og-preview.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StudentKit - 158 Free Online Academic, Engineering and Developer Tools" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@StudentKitApp" />
    <meta name="twitter:creator" content="@StudentKitApp" />
    <meta name="twitter:url" content="https://studentkit.dev/" />
    <meta name="twitter:title" content="StudentKit – Free Academic, Engineering & Developer Utilities" />
    <meta name="twitter:description" content="158 free, privacy-first, client-side tools for students, engineers, and developers. Zero trackers, no signup, and instant in-browser computation." />
    <meta name="twitter:image" content="https://studentkit.dev/assets/og-preview.svg" />

    <!-- Structured Data (JSON-LD): WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "StudentKit",
      "url": "https://studentkit.dev/",
      "description": "158 free, privacy-first online tools for students, engineers, and developers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://studentkit.dev/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data (JSON-LD): SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "StudentKit",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "Comprehensive suite of 158 client-side academic, engineering, mathematics, and developer tools.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Structured Data (JSON-LD): Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "StudentKit",
      "url": "https://studentkit.dev/",
      "logo": "https://studentkit.dev/favicon.svg",
      "sameAs": [
        "https://github.com/fluxedustart"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
